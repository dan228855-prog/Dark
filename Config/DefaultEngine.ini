r.LocalFogVolume.RenderIntoVolumetricFog=0
r.LocalFogVolume.GlobalStartDistance=300
; Сетка объёмного тумана мельче (8 -> 6 пикселей): меньше ореолов-«призраков» вокруг деревьев.
r.VolumetricFog.GridPixelSize=6
; Сборка тяжёлых мешей из паков (Nanite, distance fields) просит 3-4.6 ГБ на один меш, а параллельно
; их собиралось несколько - на 16 ГБ памяти редактор зависал и вылетал (Out of memory / page file).
; Ограничиваем одновременную сборку и общий объём памяти под неё; результат сборки тот же.
Editor.AsyncAssetCompilationMaxMemoryUsage=6
Editor.AsyncStaticMeshCompilationMaxConcurrency=2
Editor.AsyncSkinnedAssetCompilationMaxConcurrency=1

